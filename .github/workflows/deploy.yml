name: Deploy Website

on: workflow_dispatch

permissions:
  id-token: write # GitHub OIDC → AWS 역할 (정적 키 없음)
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 9
          
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::744549229387:role/comento/oidc-github-comento-blog-prod
          aws-region: ap-northeast-2

      - name: Set Env
        run: npm config set //npm.pkg.github.com/:_authToken ${{ secrets.PRIVATE_REGISTRY_TOKEN }}

      - name: Install modules
        run: pnpm install

      - name: Fetch posts (s3 _source)
        run: pnpm fetch:posts

      - name: Build application
        run: pnpm build

      - name: Deploy to S3
        run: aws s3 sync ./dist/ s3://${{ secrets.BUCKET_ID }} --exclude "_source/*"

      - name: Create CloudFront invalidation
        run: aws cloudfront create-invalidation --distribution-id ${{ secrets.DISTRIBUTION_ID }} --paths "/*"
